# Build Docker (GHCR) + Deploy Square Cloud
# Deploy para Digital Ocean desativado (job build).

name: Build and Deploy

on:
  push:
    branches: [main, master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            V=$(jq -r '.version' composer.json)
            echo "tag=${V}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create auth.json for Composer
        run: bash scripts/create-auth-json.sh
        env:
          COMPOSER_GITHUB_USERNAME: ${{ secrets.COMPOSER_GITHUB_USERNAME }}
          COMPOSER_GITHUB_TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  deploy-squarecloud:
    name: Deploy to Square Cloud
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: openssl, fileinfo, json, sodium, pdo
          tools: composer

      - name: Create auth.json for Composer (vai no zip; Square Cloud usa para composer install)
        run: bash scripts/create-auth-json.sh
        env:
          COMPOSER_GITHUB_USERNAME: ${{ secrets.COMPOSER_GITHUB_USERNAME }}
          COMPOSER_GITHUB_TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}

      - name: Download composer.phar (Square Cloud espera composer.phar no projeto)
        run: |
          curl -sS https://getcomposer.org/download/latest-stable/composer.phar -o composer.phar
          chmod +x composer.phar

      - name: Create deploy zip (sem .git; inclui composer.phar e auth.json)
        run: |
          zip -r app.zip . -x ".git/*" -x ".git*" -x "*.zip" -x "vendor/*"
          echo "Zip size: $(du -h app.zip | cut -f1)"

      - name: Deploy to Square Cloud (API)
        env:
          SQUARE_TOKEN: ${{ secrets.SQUARE_TOKEN }}
          SQUARE_APPLICATION_ID: ${{ secrets.SQUARE_APPLICATION_ID }}
        run: |
          set -e
          COMMIT_RES=$(curl -s -S --max-time 120 -w "\n%{http_code}" -X POST \
            "https://api.squarecloud.app/v2/apps/${SQUARE_APPLICATION_ID}/commit" \
            -H "Authorization: ${SQUARE_TOKEN}" \
            -F "file=@app.zip")
          HTTP_CODE=$(echo "$COMMIT_RES" | tail -n1)
          BODY=$(echo "$COMMIT_RES" | sed '$d')
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Commit OK (HTTP $HTTP_CODE)"
          else
            echo "Commit response (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi
          sleep 2
          RESTART_RES=$(curl -s -S --max-time 60 -w "\n%{http_code}" -X POST \
            "https://api.squarecloud.app/v2/apps/${SQUARE_APPLICATION_ID}/restart" \
            -H "Authorization: ${SQUARE_TOKEN}")
          R_CODE=$(echo "$RESTART_RES" | tail -n1)
          if [ "$R_CODE" -ge 200 ] && [ "$R_CODE" -lt 300 ]; then
            echo "Restart OK (HTTP $R_CODE)"
          else
            echo "Restart response (HTTP $R_CODE): $(echo "$RESTART_RES" | sed '$d')"
            exit 1
          fi
