services:
  ms-keys-api:
    image: ms-keys-api:latest
    container_name: ms-keys-api
    build:
      context: .
      args:
        - WITH_COMPOSER="true"
        - WITH_XDEBUG="true"
        - APP_ENV="production"
    working_dir: /var/www/
    volumes:
      - .:/var/www/
      - ./docker/xdebug-3.1.0.ini:/usr/local/etc/php/conf.d/xdebug-custom.ini
    ports:
      - "8088:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=true
      - PHP_IDE_CONFIG=serverName=localhost
      - XDEBUG_CONFIG=client_host=192.168.18.191
    restart: on-failure
    networks:
      app-network:
        ipv4_address: 172.24.110.20


  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      app-network:
        ipv4_address: 172.24.110.30
  db:
    container_name: db
    hostname: db
    image: postgres:latest
    restart: always
    ports:
      - "5432:5432"
    expose:
      - "5432"
    environment:
      - DOCKER=1
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=wnmMo2lvkStYqFEHx
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - postgres_db_data:/var/lib/postgresql/data
    networks:
      app-network:
        ipv4_address: 172.24.110.40

networks:
  app-network:
    name: app-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.110.0/24
volumes:
  postgres_db_data:
